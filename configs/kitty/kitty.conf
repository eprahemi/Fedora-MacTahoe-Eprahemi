# ============================================================
#  KITTY — THE MAC-TAHOE LIQUID ENGINE  (Colorful Edition)
# ============================================================
#  Glass look + full Catppuccin Mocha palette with Mac accents
#  Interactive: hints, diff, themes, unicode picker, remote control
# ============================================================

# --- [1] THE LIQUID ENGINE ---
# This makes the terminal feel like it's running at 144Hz+
repaint_delay 6
input_delay 1
sync_to_monitor yes
# This adds a motion blur trail to the cursor (the "Arch Rice" look)
cursor_trail 10
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 0

# --- [2] TYPOGRAPHY & LIGATURES ---
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
disable_ligatures never
box_drawing_scale 0.001, 1, 1.5, 2

# --- [3] THE MAC-TAHOE "GLASS" LOOK ---
background_opacity 0.75
dynamic_background_opacity yes
# If you have GNOME Blur enabled, this will look like frosted glass
hide_window_decorations yes
window_padding_width 20
background #1e1e2e
foreground #cdd6f4

# --- [3.5] THE FULL PALETTE (Catppuccin Mocha + Mac buttons) ---
# 16 colors so ls, vim, fish syntax highlighting all pop
color0  #45475a   # black        (mocha surface0)
color1  #ff5f56   # red          (Mac close button)
color2  #27c93f   # green        (Mac max button)
color3  #ffbd2e   # yellow       (Mac min button)
color4  #007aff   # blue         (Mac highlight)
color5  #cba6f7   # purple       (mocha mauve)
color6  #94e2d5   # cyan         (mocha teal)
color7  #cdd6f4   # white        (mocha text)
color8  #585b70   # bright black (mocha surface1)
color9  #ff5f56   # bright red
color10 #27c93f   # bright green
color11 #ffbd2e   # bright yellow
color12 #007aff   # bright blue
color13 #cba6f7   # bright purple
color14 #94e2d5   # bright cyan
color15 #f5e0dc   # bright white (mocha rosewater)

# Selection — rosewater glow instead of boring grey
selection_foreground #1e1e2e
selection_background #f5e0dc

# --- [4] THE "WOW" CURSOR ---
# A thick beam that pulses like a Mac
cursor_shape beam
cursor_beam_thickness 2
cursor_blink_interval 0.4
cursor_stop_blinking_after 0
cursor #f5e0dc
cursor_text_color #1e1e2e

# --- [5] THE ELITE TAB BAR ---
# Looks like a high-end browser at the top
tab_bar_edge top
tab_bar_margin_height 10 0
tab_bar_style separator
tab_separator " | "
active_tab_foreground   #11111b
active_tab_background   #007aff
active_tab_font_style   bold
inactive_tab_foreground #6c7086
inactive_tab_background #1e1e2e

# --- [5.5] ACTIVE WINDOW GLOW ---
# The focused window gets a Mac-blue border (visible with splits)
window_border_width 1
active_border_color   #007aff
inactive_border_color #313244

# --- [6] INTERACTIVE COOLNESS ---
# When you hover over a link, it glows
url_color #89b4fa
url_style curly
detect_urls yes
show_hyperlink_targets yes
copy_on_select yes
# Hide the mouse while typing — cleaner focus
mouse_hide_wait 2
# Deep scrollback for hints/show_scrollback
scrollback_lines 10000

# --- [6.5] SHELL INTEGRATION + REMOTE CONTROL ---
# Prompt marks + cwd tracking: Ctrl+Shift+Home/End jump between prompts
shell_integration enabled
# Control this kitty from ANY terminal:  kitty @ new-window
#                                         kitty @ set-colors background #1e1e2e
#                                         kitty @ send-text --match title:fish "ls -la\n"
allow_remote_control socket-only
# NOTE: do NOT use unix:$TMPDIR/kitty — systemd/GNOME sessions don't export
# TMPDIR, so kitty leaves the literal $TMPDIR and joins it with the tempdir,
# producing an invalid socket path. Absolute path + auto -{kitty_pid} suffix.
listen_on unix:/tmp/kitty

# --- [6.6] INTERACTIVE KITTENS ---
# ctrl+shift+d          interactive diff viewer (kitten diff)
# ctrl+shift+f4         live theme switcher (kitten themes)
# ctrl+shift+p          hints: pick URL/path/line on screen (default)
# ctrl+shift+u          unicode/emoji picker (default)
# ctrl+shift+h          open scrollback in pager (default)
# ctrl+shift+/          search scrollback (default)
# ctrl+shift+x          jump to previous shell prompt (default)
# ctrl+shift+g          show last command output (default)
map ctrl+shift+d kitten diff
map ctrl+shift+f4 kitten themes

# --- [7] TERMINAL BELL (The "Silent" Wow) ---
# Instead of a beep, the screen flashes like a camera
visual_bell_duration 0.1
visual_bell_color #313244
enable_audio_bell no

# --- [8] THE LAYOUT MASTER ---
# Press Ctrl+Shift+L to cycle layouts. "Stack" makes one window giant.
enabled_layouts tall,stack,fat,grid

# --- [9] SMART CLIPBOARD & PASTE ---
# OSC 52: copy/paste works in tmux and SSH sessions
clipboard_control write-clipboard write-primary
# Strip trailing whitespace on multi-line paste (smart)
strip_trailing_spaces smart

# --- [10] CLOSE WARNING ---
# With shell integration: asks only when a command is actually running
# (a window sitting at a shell prompt closes instantly — no nagging)
confirm_os_window_close -1

# ktheme auto-theme — regenerated by ktheme on wallpaper change
include auto-theme.conf
