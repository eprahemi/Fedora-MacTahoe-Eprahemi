#  💡  HOW TO USE THIS FILE
# ═══════════════════════════════════════════════════════════════════════════════
#
#  1.  Find the option you want to change
#  2.  Read the explanation above it to understand what it does
#  3.  Look for:     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#  4.  Delete the # from the line right below it
#  5.  Change the value after = if you want something different
#  6.  Save the file
#  7.  Run this (no reboot needed):
#
#          sudo systemctl restart systemd-logind
#
#  Done!  To verify:
#     loginctl show-session $(loginctl | grep $(whoami) | awk '{print $1}') \
#       -p HandleLidSwitch -p HandleLidSwitchExternalPower
#
# ═══════════════════════════════════════════════════════════════════════════════
#
#  ⚠  POSSIBLE VALUES  (most options accept these):
#
#     ignore         →  Does nothing at all (laptop stays on)
#     suspend        →  Sleep mode (quick on/off, saves battery)
#     hibernate      →  Saves everything to disk, then turns off
#     hybrid-sleep   →  Sleep + hibernate at the same time
#     suspend-then-hibernate →  Sleep first, hibernate later
#     lock           →  Just lock the screen
#     poweroff       →  Shut down completely
#     reboot         →  Restart
#     halt           →  Old-style shutdown (just stops CPU)
#     kexec          →  Fast reboot (skips BIOS)
#     factory-reset  →  Factory reset (use with extreme care!)
#
# ═══════════════════════════════════════════════════════════════════════════════

[Login]


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  1.  LID CLOSE  —  What happens when you close the laptop lid              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
#  ── What this controls ──
#  When you close the physical lid of your laptop, the system can do different
#  things. You can set separate behaviors for when you're on battery, when
#  you're plugged in, and when you're connected to a dock.
#
#  ── Examples ──
#    HandleLidSwitch=ignore       →  close lid = nothing happens at all
#    HandleLidSwitch=suspend      →  close lid = laptop goes to sleep
#    HandleLidSwitch=lock         →  close lid = screen locks (good for privacy)
#    HandleLidSwitch=hibernate    →  close lid = saves everything, turns off
#    HandleLidSwitch=poweroff     →  close lid = shuts down completely
# ─────────────────────────────────────────────────────────────────────────────

# ── ON BATTERY (laptop not plugged in) ──
#   This is what happens when you close the lid and your laptop is running on
#   battery. Default is "suspend" — saves power but wakes up quickly when you
#   open the lid again.
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandleLidSwitch=ignore

# ── ON CHARGER (laptop plugged in) ──
#   This is what happens when you close the lid while the charger is connected.
#   Useful if you use an external monitor and keep the lid closed. Set to
#   "ignore" if you want to keep using the laptop with the lid shut.
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandleLidSwitchExternalPower=ignore

# ── WHILE DOCKED (USB-C hub / Thunderbolt dock) ──
#   This is what happens when you close the lid and you're connected to a dock.
#   Default is "ignore" — assumes you're using external monitors.
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandleLidSwitchDocked=ignore

# ── ALLOW APPS TO BLOCK LID ACTION? ──
#   Some apps (like video players, movie streaming, presentations) can tell the
#   system "don't sleep, I'm playing something!". This setting decides who wins.
#
#   true   →  lid action wins — the lid closes, the action happens,
#             even if an app said not to sleep
#   false  →  app wins — if an app blocks sleep, the lid action is ignored
#             (this is the default)
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandleLidSwitchIgnoreInhibited=false


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  2.  POWER BUTTONS  —  Physical buttons on your laptop or keyboard          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
#  ── What this controls ──
#  When you press a physical button (power, sleep, hibernate, reboot), the
#  system does something. You can change what each button does.
#
#  ── Examples ──
#    HandlePowerKey=poweroff      →  power button = shut down
#    HandlePowerKey=ignore        →  power button = does nothing
#    HandlePowerKey=hibernate     →  power button = save everything, turn off
#    HandlePowerKey=lock          →  power button = just lock the screen
#    HandleSuspendKey=ignore      →  sleep key = does nothing
# ─────────────────────────────────────────────────────────────────────────────

# ── POWER BUTTON ──
#   The physical power button on your laptop or desktop case.
#   Options: ignore | poweroff | reboot | halt | kexec | suspend | hibernate |
#            hybrid-sleep | suspend-then-hibernate | lock | factory-reset
#   Default: poweroff
#
#   Example: HandlePowerKey=ignore  →  power button does nothing (prevents
#            accidental shutdowns)
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandlePowerKey=poweroff

# ── SUSPEND BUTTON ──
#   Some laptops have a dedicated "sleep" key (often Fn+F12, a moon icon, or
#   a crescent moon symbol). This controls what that key does.
#   Options: ignore | poweroff | reboot | halt | kexec | suspend | hibernate |
#            hybrid-sleep | suspend-then-hibernate | lock
#   Default: suspend
#
#   Example: HandleSuspendKey=lock  →  sleep key just locks the screen
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandleSuspendKey=suspend

# ── HIBERNATE BUTTON ──
#   Some keyboards have a dedicated "hibernate" key (rare, but some gaming
#   laptops and high-end keyboards have one).
#   Options: ignore | poweroff | reboot | halt | kexec | suspend | hibernate |
#            hybrid-sleep | suspend-then-hibernate | lock
#   Default: hibernate
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandleHibernateKey=hibernate

# ── REBOOT BUTTON ──
#   Some devices have a physical "reboot" key.
#   Options: ignore | poweroff | reboot | halt | kexec | suspend | hibernate |
#            hybrid-sleep | suspend-then-hibernate | lock
#   Default: reboot
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HandleRebootKey=reboot

# ── OVERRIDE APP INHIBITS FOR BUTTONS ──
#   If an app says "don't sleep, don't shut down" (like a movie player), these
#   settings let your button press override the app anyway.
#
#   true   →  button press always works (ignores the app)
#   false  →  app can block the button (default)
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#PowerKeyIgnoreInhibited=false

#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#SuspendKeyIgnoreInhibited=false

#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HibernateKeyIgnoreInhibited=false

#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#RebootKeyIgnoreInhibited=false


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  3.  IDLE TIMEOUTS  —  Auto-action when nobody touches the computer         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
#  ── What this controls ──
#  If you walk away and don't touch the computer for a while, the system can
#  automatically do something — like sleep, lock, or hibernate.
#
#  ── Examples ──
#    IdleAction=suspend  +  IdleActionSec=15min
#      →  After 15 minutes of no touching, laptop goes to sleep
#
#    IdleAction=lock  +  IdleActionSec=5min
#      →  After 5 minutes of no touching, screen locks (good for offices)
#
#    IdleAction=hibernate  +  IdleActionSec=1h
#      →  After 1 hour of no touching, saves everything and turns off
# ─────────────────────────────────────────────────────────────────────────────

# ── WHAT TO DO WHEN IDLE ──
#   Options: ignore | poweroff | reboot | halt | kexec | suspend | hibernate |
#            hybrid-sleep | suspend-then-hibernate | lock
#   Default: ignore (does nothing)
#
#   Tip: Combine with IdleActionSec to control when it kicks in.
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#IdleAction=ignore

# ── HOW LONG BEFORE IDLE ACTION ──
#   This sets the timer. After this much time of no activity, the IdleAction
#   above will fire.
#
#   Format: number + unit (s = seconds, min = minutes, h = hours)
#   Default: 30min
#   Examples: 5min = 5 minutes, 1h = 1 hour, 30s = 30 seconds
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#IdleActionSec=30min


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  4.  SLEEP STATES  —  Kernel-level sleep methods (usually leave as-is)      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
#  ── What this controls ──
#  These are low-level settings that tell the kernel HOW to sleep. Most people
#  never need to touch these — the defaults work fine on almost all hardware.
#  Only change these if you're having sleep/wake issues.
#
#  ── Possible values ──
#    mem       →  Suspend to RAM (standard sleep, quick on/off)
#    standby   →  Power-on suspend (light sleep, more power used)
#    freeze    →  Freeze all running tasks (very light sleep, wakes instantly)
#    disk      →  Hibernate (save everything to swap, full power off)
#
#  ── Examples ──
#    SuspendState=mem              →  only use "suspend to RAM", skip others
#    HibernateState=disk           →  default hibernate method
# ─────────────────────────────────────────────────────────────────────────────

# ── SUSPEND STATES (list in order of preference) ──
#   The kernel will try each one until one works.
#   Default: "mem standby freeze"
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#SuspendState=mem standby freeze

# ── HIBERNATE STATE ──
#   Which method to use for hibernation.
#   Default: "disk"
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HibernateState=disk

# ── HYBRID SLEEP STATE ──
#   Which method to use for hybrid sleep (sleep + hibernate together, so you
#   can wake up fast but still survive a power loss).
#   Default: "disk"
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HybridSleepState=disk

# ── SUSPEND ESTIMATION TIMEOUT ──
#   How long to wait before assuming the kernel has finished suspending or
#   resuming. You probably don't need to change this.
#   Default: 60 seconds
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#SuspendEstimationSec=60


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  5.  TIMERS & DELAYS  —  How long to wait before forcing things             ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
#  ── What this controls ──
#  When you shut down, log out, or suspend, apps sometimes need time to save
#  their work. These settings control how long the system waits before forcing
#  things.
#
#  ── Examples ──
#    InhibitDelayMaxSec=10s   →  give apps up to 10 seconds before force-closing
#    UserStopDelaySec=30s     →  wait 30 seconds after logout before killing apps
# ─────────────────────────────────────────────────────────────────────────────

# ── APP DELAY TIMEOUT ──
#   Some apps can say "hold on, I'm saving!" before the system sleeps or shuts
#   down. This is the MAXIMUM time we give them to finish (they can't delay
#   longer than this).
#   Default: 5s  |  Format: 10s, 1min
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#InhibitDelayMaxSec=5

# ── USER LOGOUT DELAY ──
#   When you log out, systemd waits this long before killing your background
#   apps and services. Gives them time to save state.
#   Default: 10s  |  Format: 10s, 30s, 1min
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#UserStopDelaySec=10


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  6.  REBOOT KEY  —  For custom hardware (most people can ignore this)       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
#  ── What this controls ──
#  Some devices have a physical reboot button or key. This setting tells
#  systemd which keycode to listen for. You only need this if you have
#  custom or unusual hardware.
#  Default: "reboot" (standard keycode 0x88)
# ─────────────────────────────────────────────────────────────────────────────

#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#RebootKey=reboot


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  7.  ADVANCED  —  For power users only                                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
#
#  ── What this controls ──
#  These are advanced settings that most people never need to touch.
#  Only change them if you know what you're doing.
# ─────────────────────────────────────────────────────────────────────────────

# ── SLEEP OPERATIONS (polkit) ──
#   Controls which sleep methods are available to non-root users.
#   If you want to DISABLE hibernation for regular users just remove it
#   from the list:
#     SleepOperation=suspend hybrid-sleep suspend-then-hibernate
#   Default: all of them
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#SleepOperation=suspend hibernate hybrid-sleep suspend-then-hibernate

# ── HOLD OFF AFTER RESUME ──
#   After the laptop wakes up from sleep, it ignores lid and button events
#   for this amount of time. This prevents accidental triggers — like
#   closing the lid right after opening it, or bumping a button.
#   Default: 5s  |  Format: 5s, 10s
#
#     ─────────────────────────────────────
#     ▼  UNCOMMENT THE LINE BELOW TO ENABLE:
#HoldoffTimeoutSec=5s


